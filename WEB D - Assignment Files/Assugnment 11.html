<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessibility</title>
</head>
<body>

  <!-- Skip link: lets keyboard users jump past the navigation -->
  <a href="#main">Skip to main content</a>

  <!-- Navigation with an ARIA label -->
  <nav aria-label="Main navigation">
    <a href="#home">Home</a>
    <a href="#help">Help</a>
  </nav>

  <main id="main">
    <!-- Proper heading -->
    <h1>Accessible Page</h1>

    <!-- Image with alt attribute (empty alt = decorative image) -->
    <img src="banner.jpg" alt="" width="275" height="22">

    <!-- Icon-only button needs an ARIA label so screen readers announce it -->
    <button type="button" aria-label="Close">X</button>

    <!-- Form control with a properly linked label -->
    <p>
      <label for="search">Search:</label>
      <input type="text" id="search" name="search">
    </p>
  </main>

</body>
</html>
