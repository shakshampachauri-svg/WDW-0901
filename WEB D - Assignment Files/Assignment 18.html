<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADC College Admission 2026</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header, footer {
      background-color: #1a237e;
      color: #fff;
      text-align: center;
    }
    header { padding: 22px 16px; }
    header h1 { margin: 0; font-size: 2em; }
    footer { padding: 12px 16px; margin-top: auto; }

    main {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 0 8px 20px;
      flex: 1;
    }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    caption { padding: 4px 0; }
    th, td {
      border: 1px solid #999;
      padding: 6px 7px;
      text-align: left;
    }
    th {
      background-color: #e8eaf6;
      text-align: center;
    }

    /* Form */
    fieldset { margin-top: 20px; padding: 4px 14px 12px; }
    .field { margin: 0 0 14px; }
    label { display: block; }
    input[type="text"],
    input[type="email"] { width: 260px; max-width: 100%; }
    textarea { width: 100%; max-width: 460px; }
    button { padding: 4px 8px; font-size: 1em; }

    /* Visible keyboard focus for accessibility */
    a:focus, input:focus, select:focus, textarea:focus, button:focus {
      outline: 3px solid #ff9800;
      outline-offset: 2px;
    }

    /* Skip link: hidden until focused */
    .skip-link {
      position: absolute;
      left: -999px;
    }
    .skip-link:focus {
      left: 8px;
      top: 8px;
      background: #fff;
      padding: 6px 10px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <a class="skip-link" href="#main">Skip to main content</a>

  <header>
    <h1>ABC College Admission 2026</h1>
  </header>

  <main id="main">

    <section aria-labelledby="courses-heading">
      <h2 id="courses-heading">Courses and Fees</h2>

      <div class="table-wrap">
        <table>
          <caption>Available Courses</caption>
          <thead>
            <tr>
              <th scope="col">Course</th>
              <th scope="col">Seats</th>
              <th scope="col">Fees</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>B.Tech CSE</td>
              <td>120</td>
              <td>₹90,000</td>
            </tr>
            <tr>
              <td>BCA</td>
              <td>60</td>
              <td>₹45,000</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section aria-labelledby="form-heading">
      <h2 id="form-heading" style="position:absolute; left:-999px;">Application form</h2>

      <form action="#" method="post">
        <fieldset>
          <legend>Application Form</legend>

          <div class="field">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
          </div>

          <div class="field">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="field">
            <label for="course">Course:</label>
            <select id="course" name="course" required>
              <option value="btech-cse">B.Tech CSE</option>
              <option value="bca">BCA</option>
            </select>
          </div>

          <div class="field">
            <label for="statement">Statement:</label>
            <textarea id="statement" name="statement" rows="4" cols="50"></textarea>
          </div>

          <button type="submit">Apply</button>
        </fieldset>
      </form>
    </section>

  </main>

  <footer>
    <small>&copy; 2026 ABC College</small>
  </footer>

</body>
</html>
